name: Terraform Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  fast-checks:
    name: Fast Checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install lintofu
        run: npm ci
      - name: lintofu
        run: npm run lint
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.4
      - name: terraform fmt
        run: terraform fmt -recursive -check
      - name: terraform init
        run: terraform init -test-directory=tests/unit
      - name: terraform validate
        run: terraform validate
      - name: terraform test
        run: terraform test -test-directory=tests/unit

  slow-checks:
    name: Slow Checks
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-west-2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.4
      - name: terraform init
        run: terraform init -test-directory=tests/integration
      - name: terraform test
        run: terraform test -test-directory=tests/integration
